org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project lives on I:\ while the Dart pub cache lives on C:\. Kotlin's
# incremental compiler resolves plugin sources relative to the project via
# File.relativeTo(), which throws IllegalArgumentException across Windows drive
# roots ("this and base files have different roots"). Disabling incremental
# Kotlin compilation avoids that path converter entirely. The Kotlin surface of
# a Flutter app is tiny (MainActivity plus plugin shims), so the build-time cost
# is negligible. Remove this if the project and pub cache ever share a drive.
kotlin.incremental=false
