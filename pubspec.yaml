name: action_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # cupertino_icons was removed at Day 19: it arrives with the Flutter
  # template and nothing in this app imports it. Action uses Material icons
  # throughout, on both platforms, because the icon set is part of its own
  # visual language rather than the host platform's.
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  uuid: ^4.6.0
  image: ^4.9.1
  google_mlkit_text_recognition: ^0.16.0
  firebase_ai: ^3.15.0
  firebase_app_check: ^0.4.6
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # V2 / BYOK. `http` was already in the lock file transitively; it is a direct
  # dependency now because the provider adapters talk to OpenAI, Anthropic and
  # Gemini over plain HTTPS. There is no official Dart SDK for any of the three,
  # and raw HTTP is what their own docs specify for a language without one.
  http: ^1.6.0
  # OS-backed secret storage for the user's own API key: Android Keystore,
  # iOS Keychain. Wrapped behind `SecretStore` so tests never touch a platform
  # channel and the package can be replaced without touching call sites.
  flutter_secure_storage: ^9.2.4
  # SHA-256 for the file identity tool, and the chunked sink it hashes through
  # so a large PDF is never held in memory twice. Both were already in the lock
  # file transitively; they are direct now because Action's own code imports
  # them. Dart has no SHA-256 in its core libraries, and this is the package the
  # SDK team maintains — a hand-rolled digest would be exactly the home-grown
  # cryptography this project has ruled out everywhere else.
  crypto: ^3.0.6
  convert: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Day 16: lets the local-day timer be advanced a day at a time in a test
  # instead of a test waiting one. Test-only; nothing ships with it.
  fake_async: ^1.3.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Source art lives in assets/ but is not declared under flutter.assets: both
# tools consume it at generation time and write into android/app/src/main/res,
# so shipping it inside the APK as well would be dead weight.
flutter_launcher_icons:
  android: "ic_launcher"
  # Day 19: iOS was still carrying Flutter's template icon, which App Store
  # Connect rejects. Generated from the same source as Android so the two
  # stores show the same app.
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
  # Adaptive icons are masked by the launcher, so the foreground is drawn at 72%
  # scale to stay inside the safe zone while the background supplies the colour.
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#2563EB"
  image: "assets/splash/splash.png"
  # Android 12+ draws the splash itself from a separate, smaller icon slot.
  android_12:
    color: "#2563EB"
    image: "assets/splash/splash.png"
    icon_background_color: "#2563EB"
